services:
  cloudops-lab:
    build:
      context: .
      dockerfile: infra/Dockerfile
    ports:
      - '127.0.0.1:8080:8080'
    read_only: true
    tmpfs:
      - /app/.lab:uid=10001,gid=10001,mode=0700
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    restart: 'no'
