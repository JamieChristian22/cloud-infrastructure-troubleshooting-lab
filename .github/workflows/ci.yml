name: Test and incident replay
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install this project (no runtime dependencies)
        run: python -m pip install -e .
      - name: Compile Python code
        run: python -m compileall -q src tests
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Execute four failure and recovery scenarios
        run: python -m cloudops_lab demo --output ci-evidence
      - name: Attach reproducible evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: incident-replay-py${{ matrix.python-version }}
          path: ci-evidence/
          if-no-files-found: warn
