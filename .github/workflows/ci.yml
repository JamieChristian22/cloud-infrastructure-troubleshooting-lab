name: Test and incident replay
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install this project (no runtime dependencies)
        run: python -m pip install -e .
      - name: Compile Python code
        run: python -m compileall -q src tests
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Execute four failure and recovery scenarios
        run: python -m cloudops_lab demo --output ci-evidence
      - name: Attach reproducible evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: incident-replay-py${{ matrix.python-version }}
          path: ci-evidence/
          if-no-files-found: warn

  docker-smoke:
    name: Docker / Compose recovery smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start rootless service
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Test live service from host
        run: |
          curl --fail --silent http://127.0.0.1:8080/health/live
          curl --fail --silent http://127.0.0.1:8080/health/ready
          curl --fail --silent http://127.0.0.1:8080/api/orders
      - name: Inject actual SQLite disconnect and verify failure
        run: |
          docker compose exec -T cloudops-lab python -m cloudops_lab inject dependency_outage
          docker compose exec -T cloudops-lab python -m cloudops_lab status | grep '"readiness_http": 503'
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/orders)" = "503"
      - name: Recover dependency and verify requests
        run: |
          docker compose exec -T cloudops-lab python -m cloudops_lab recover
          curl --fail --silent http://127.0.0.1:8080/health/ready
          curl --fail --silent http://127.0.0.1:8080/api/orders
      - name: Container diagnostics on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down containers
        if: always()
        run: docker compose down --volumes --remove-orphans

  monitoring-smoke:
    name: Prometheus + Grafana local monitoring smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GRAFANA_ADMIN_PASSWORD: ci-temporary-local-only
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate optional monitoring configuration
        run: docker compose -f compose.yaml -f compose.monitoring.yaml config --quiet
      - name: Start local telemetry stack
        run: docker compose -f compose.yaml -f compose.monitoring.yaml up -d --build
      - name: Wait for Prometheus and Grafana HTTP health
        run: |
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:9090/-/healthy >/dev/null && curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Verify configured telemetry and Grafana dashboard
        run: |
          docker compose -f compose.yaml -f compose.monitoring.yaml exec -T cloudops-lab python -m cloudops_lab probe --requests 3
          sleep 12
          curl --fail --silent -G --data-urlencode 'query=lab_uptime_seconds' http://127.0.0.1:9090/api/v1/query | grep '"resultType":"vector"'
          curl --fail --silent -u admin:ci-temporary-local-only http://127.0.0.1:3000/api/dashboards/uid/cloudops-lab | grep 'CloudOps Lab'
      - name: Capture telemetry logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.monitoring.yaml logs --no-color
      - name: Tear down monitoring
        if: always()
        run: docker compose -f compose.yaml -f compose.monitoring.yaml down --volumes --remove-orphans
